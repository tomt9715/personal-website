    <section class="section container">
      <div class="prose">
        <h1>Contact</h1>
        <p class="hero-lede">Have a question or want to connect? Send a message below.</p>

        <form id="contact-form" action="https://formspree.io/f/xdenakpl" method="POST">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="visually-hidden" />
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>

        <p id="form-status" role="status" hidden></p>
      </div>
    </section>
